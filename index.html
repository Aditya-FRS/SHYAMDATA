<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PDF Bulk Downloader</title>

<style>
body {
    font-family: Arial;
    background: #f4f6f8;
    padding: 30px;
}

.container {
    max-width: 1000px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 10px;
}

textarea {
    width: 100%;
    height: 400px;
    box-sizing: border-box;
    padding: 15px;
    font-family: monospace;
    font-size: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

button {
    padding: 12px 20px;
    margin: 12px 8px 12px 0;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: white;
    cursor: pointer;
    font-size: 15px;
}

button:disabled {
    background: #999;
}

#status {
    margin-top: 15px;
    padding: 12px;
    background: #eef2ff;
    border-radius: 6px;
    white-space: pre-wrap;
}

.file {
    padding: 7px;
    border-bottom: 1px solid #eee;
}
</style>
</head>

<body>

<div class="container">

<h2>📚 PDF Bulk Downloader</h2>

<p>
Copy the JSON from <b>Network → Response</b> and paste it below:
</p>

<textarea
id="jsonInput"
placeholder="Paste your complete JSON response here..."
></textarea>

<br>

<button onclick="extractPDFs()">
Extract PDFs
</button>

<button
id="downloadButton"
onclick="downloadAll()"
disabled
>
Download All PDFs
</button>

<div id="status">
Waiting for JSON...
</div>

<div id="fileList"></div>

</div>


<script>

let pdfs = [];


/* =========================
   EXTRACT PDF INFORMATION
========================= */

function extractPDFs() {

    const text =
        document.getElementById("jsonInput").value.trim();

    const status =
        document.getElementById("status");

    const list =
        document.getElementById("fileList");

    if (!text) {

        status.textContent =
            "Please paste the JSON first.";

        return;
    }


    try {

        const json =
            JSON.parse(text);


        /*
        Your API structure:

        data
          └── courseContent
                  ├── name
                  ├── url
                  └── format
        */

        const contents =
            json?.data?.courseContent;


        if (!Array.isArray(contents)) {

            throw new Error(
                "data.courseContent was not found."
            );

        }


        /*
        Extract every PDF that has a URL
        */

        pdfs =
            contents.filter(item => {

                return (
                    item &&
                    item.url &&
                    (
                        String(item.format)
                            .toLowerCase() === "pdf"
                        ||
                        String(item.url)
                            .toLowerCase()
                            .includes(".pdf")
                    )
                );

            });


        list.innerHTML = "";


        pdfs.forEach((pdf, index) => {

            const div =
                document.createElement("div");

            div.className = "file";

            div.textContent =
                (index + 1) +
                ". " +
                (pdf.name || "PDF");

            list.appendChild(div);

        });


        status.textContent =
            "Found " +
            pdfs.length +
            " PDF(s).";


        document.getElementById(
            "downloadButton"
        ).disabled =
            pdfs.length === 0;


    }

    catch(error) {

        pdfs = [];

        document.getElementById(
            "downloadButton"
        ).disabled = true;

        status.textContent =
            "Invalid JSON:\n" +
            error.message;

    }

}


/* =========================
   DOWNLOAD ALL
========================= */

async function downloadAll() {

    if (pdfs.length === 0) {

        alert(
            "Extract the PDFs first."
        );

        return;
    }


    const button =
        document.getElementById(
            "downloadButton"
        );

    const status =
        document.getElementById(
            "status"
        );


    button.disabled = true;


    let success = 0;
    let failed = 0;


    for (
        let i = 0;
        i < pdfs.length;
        i++
    ) {

        const pdf =
            pdfs[i];


        status.textContent =
            "Downloading " +
            (i + 1) +
            " / " +
            pdfs.length +
            "\n\n" +
            pdf.name;


        try {

            const response =
                await fetch(
                    pdf.url,
                    {
                        credentials: "include"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }


            const blob =
                await response.blob();


            const blobURL =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement("a");


            link.href =
                blobURL;


            link.download =
                cleanName(
                    pdf.name ||
                    "document-" +
                    (i + 1) +
                    ".pdf"
                );


            document.body.appendChild(
                link
            );


            link.click();


            link.remove();


            URL.revokeObjectURL(
                blobURL
            );


            success++;


            /*
            Wait between downloads
            */

            await delay(700);

        }

        catch(error) {

            console.error(
                pdf.name,
                error
            );

            failed++;

        }

    }


    status.textContent =
        "Finished!\n\n" +
        "Downloaded: " +
        success +
        "\n" +
        "Failed: " +
        failed;


    button.disabled = false;

}


/* =========================
   CLEAN FILE NAME
========================= */

function cleanName(name) {

    return String(name)
        .replace(
            /[<>:"\/\\|?*]/g,
            "_"
        )
        .trim();

}


/* =========================
   DELAY
========================= */

function delay(ms) {

    return new Promise(
        resolve =>
            setTimeout(resolve, ms)
    );

}

</script>

</body>
</html>
