<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Bulk Downloader</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    padding: 30px;
}

.container {
    max-width: 1000px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

textarea {
    width: 100%;
    height: 400px;
    box-sizing: border-box;
    padding: 15px;
    font-family: monospace;
    font-size: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

button {
    padding: 12px 20px;
    margin: 12px 8px 12px 0;
    border: none;
    border-radius: 7px;
    background: #2563eb;
    color: white;
    cursor: pointer;
    font-size: 15px;
}

button:hover {
    background: #1d4ed8;
}

#status {
    margin-top: 15px;
    padding: 12px;
    background: #eef2ff;
    border-radius: 7px;
    white-space: pre-wrap;
}

#fileList {
    margin-top: 20px;
    max-height: 400px;
    overflow-y: auto;
    border: 1px solid #ddd;
    border-radius: 8px;
}

.file {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid #eee;
}

.fileName {
    flex: 1;
    word-break: break-word;
}

.openBtn {
    margin: 0;
    padding: 7px 12px;
    font-size: 13px;
    background: #16a34a;
}
</style>
</head>

<body>

<div class="container">

<h2>📚 PDF Bulk Downloader</h2>

<p>
Paste the JSON copied from
<b>Network → Response</b>.
</p>

<textarea
    id="jsonInput"
    placeholder="Paste your complete JSON response here..."
></textarea>

<br>

<button onclick="extractPDFs()">
    Extract PDFs
</button>

<button
    id="downloadAll"
    onclick="downloadAll()"
    disabled
>
    ⬇ Download All
</button>

<div id="status">
    Waiting for JSON...
</div>

<div id="fileList"></div>

</div>


<script>

let pdfs = [];


/* ============================
   EXTRACT PDF URLS
============================ */

function extractPDFs() {

    const input =
        document.getElementById("jsonInput").value.trim();

    const status =
        document.getElementById("status");

    const list =
        document.getElementById("fileList");

    if (!input) {

        status.textContent =
            "Please paste the JSON.";

        return;
    }

    try {

        const json =
            JSON.parse(input);

        const contents =
            json?.data?.courseContent;


        if (!Array.isArray(contents)) {

            throw new Error(
                "data.courseContent[] not found"
            );

        }


        pdfs = contents.filter(item => {

            return (
                item &&
                item.url &&
                (
                    String(item.format)
                        .toLowerCase() === "pdf"
                    ||
                    String(item.url)
                        .toLowerCase()
                        .includes(".pdf")
                )
            );

        });


        list.innerHTML = "";


        pdfs.forEach((pdf, index) => {

            const row =
                document.createElement("div");

            row.className = "file";


            const name =
                document.createElement("div");

            name.className = "fileName";

            name.textContent =
                `${index + 1}. ${
                    pdf.name || "PDF"
                }`;


            const open =
                document.createElement("button");

            open.className = "openBtn";

            open.textContent =
                "Open";


            open.onclick = function() {

                window.open(
                    pdf.url,
                    "_blank"
                );

            };


            row.appendChild(name);

            row.appendChild(open);

            list.appendChild(row);

        });


        status.textContent =
            `Found ${pdfs.length} PDF(s).`;


        document.getElementById(
            "downloadAll"
        ).disabled =
            pdfs.length === 0;

    }

    catch(error) {

        pdfs = [];

        document.getElementById(
            "downloadAll"
        ).disabled = true;

        status.textContent =
            "Invalid JSON:\n" +
            error.message;

    }

}


/* ============================
   OPEN ALL PDF URLS
============================ */

function downloadAll() {

    if (!pdfs.length) {

        alert(
            "Extract PDFs first."
        );

        return;
    }


    const status =
        document.getElementById("status");


    status.textContent =
        "Opening PDFs...\n\n" +
        "Chrome may ask you to allow multiple pop-ups.";


    /*
     * IMPORTANT:
     *
     * We do NOT use fetch().
     * Therefore this does not trigger
     * the previous CORS error.
     */

    pdfs.forEach((pdf, index) => {

        setTimeout(function() {

            window.open(
                pdf.url,
                "_blank"
            );

        }, index * 300);

    });


    status.textContent =
        `Attempted to open ${pdfs.length} PDF(s).\n\n` +
        `If Chrome blocked them, click the pop-up-blocked icon ` +
        `and allow pop-ups for this page.`;

}

</script>

</body>
</html>
